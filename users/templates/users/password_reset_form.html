<!DOCTYPE html>
{% extends 'mailing/base.html' %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card shadow-sm">
    <div class="card-header"><h4 class="mb-0">Восстановление пароля</h4></div>
    <div class="card-body">
        <p class="text-muted">Введите ваш Email, и мы отправим ссылку для сброса пароля.</p>
        <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit" class="btn btn-primary w-100">Отправить</button></form>
    </div>
</div></div></div>
{% endblock %}
